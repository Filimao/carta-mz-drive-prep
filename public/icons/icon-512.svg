<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Background -->
  <rect width="512" height="512" fill="#0B1220"/>
  
  <!-- Outer circle -->
  <circle cx="256" cy="256" r="240" fill="#1e40af" stroke="#60a5fa" stroke-width="8"/>
  
  <!-- Steering wheel center -->
  <circle cx="256" cy="256" r="180" fill="#0F172A"/>
  
  <!-- Steering wheel design -->
  <circle cx="256" cy="256" r="160" fill="none" stroke="#60a5fa" stroke-width="6"/>
  <circle cx="256" cy="256" r="140" fill="none" stroke="#3b82f6" stroke-width="4"/>
  
  <!-- Top grip -->
  <rect x="240" y="100" width="32" height="60" fill="#60a5fa" rx="16"/>
  <!-- Right grip -->
  <rect x="352" y="224" width="60" height="32" fill="#60a5fa" rx="16"/>
  <!-- Bottom grip -->
  <rect x="240" y="352" width="32" height="60" fill="#60a5fa" rx="16"/>
  <!-- Left grip -->
  <rect x="100" y="224" width="60" height="32" fill="#60a5fa" rx="16"/>
  
  <!-- Center hub -->
  <circle cx="256" cy="256" r="50" fill="#3b82f6" stroke="#60a5fa" stroke-width="4"/>
  
  <!-- Steering wheel spokes -->
  <line x1="256" y1="206" x2="256" y2="120" stroke="#3b82f6" stroke-width="8"/>
  <line x1="306" y1="256" x2="392" y2="256" stroke="#3b82f6" stroke-width="8"/>
  <line x1="256" y1="306" x2="256" y2="392" stroke="#3b82f6" stroke-width="8"/>
  <line x1="206" y1="256" x2="120" y2="256" stroke="#3b82f6" stroke-width="8"/>
  
  <!-- Center circle -->
  <circle cx="256" cy="256" r="30" fill="#1e40af" stroke="#60a5fa" stroke-width="3"/>
  
  <!-- Text "CARTA MZ" in the center -->
  <text x="256" y="265" font-size="20" font-weight="bold" text-anchor="middle" fill="#60a5fa" font-family="Arial, sans-serif">CARTA</text>
</svg>